<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tab Out 登录</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f3; color: #171717; }
    main { width: min(88vw, 340px); }
    h1 { margin: 0 0 22px; font-size: 20px; font-weight: 650; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #666; }
    input, button { width: 100%; min-height: 44px; border-radius: 10px; font: inherit; }
    input { border: 1px solid #d5d5d1; padding: 0 12px; background: #fff; color: #171717; }
    button { margin-top: 20px; border: 0; background: #171717; color: #fff; font-weight: 650; }
    #error { min-height: 20px; margin-top: 12px; color: #b42318; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f2f2f2; }
      input { border-color: #3a3a3a; background: #1d1d1d; color: #f2f2f2; }
      label { color: #aaa; }
      button { background: #f2f2f2; color: #111; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tab Out</h1>
    <form id="loginForm">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      const button = event.currentTarget.querySelector('button');
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || '登录失败。');
        location.reload();
      } catch (loginError) {
        error.textContent = loginError.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
